name: Spike
options:
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    DEVELOPMENT_TEAM: 539293JFA3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Spike:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
        excludes: ["Cave.s"]
      # xcodegen puts .s files in Resources by default.
      - path: App/Cave.s
        buildPhase: sources
    dependencies:
      # Embedded for the dlopen control test, not linked: the app loads it with dlopen.
      - target: SpikePlugin
        link: false
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swapify.spike.device
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Spike measures TCP transfer times from a Mac.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../App/Spike-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
  SpikePlugin:
    type: framework
    platform: iOS
    sources:
      - Plugin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.swapify.spike.device.plugin
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        TARGETED_DEVICE_FAMILY: "1"
