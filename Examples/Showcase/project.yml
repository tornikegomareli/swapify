name: Showcase
options:
  bundleIdPrefix: dev.hotreload
  deploymentTarget:
    iOS: "27.0"
packages:
  TaskUI:
    path: Packages/TaskUI
targets:
  Showcase:
    type: application
    platform: iOS
    sources: [Showcase]
    dependencies:
      - package: TaskUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.hotreload.showcase
        SWIFT_VERSION: "6.0"
