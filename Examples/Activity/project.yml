name: Activity
options:
  bundleIdPrefix: dev.swapify
  deploymentTarget:
    iOS: "27.0"
targets:
  Activity:
    type: application
    platform: iOS
    sources:
      # A synchronized folder: a Swift file added to Activity/ is in the target.
      - path: Activity
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.swapify.activity
        SWIFT_VERSION: "6.0"
